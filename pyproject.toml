[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdformat-presenterm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mdformat>=1.0,<2",
]

[project.entry-points."mdformat.parser_extension"]
presenterm = "mdformat_presenterm.plugin"
